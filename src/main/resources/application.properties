# --- H2 インメモリデータベース設定（開発・テスト用） ---
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# --- PostgreSQL 設定（将来的な接続用：必要時にコメントを外してください） ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/type-clash-db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 初期データ投入の設定
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/data.sql
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

server.port=8080

# --- Redis設定（ログインセッション管理用） ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# JWT認証用秘密鍵
jwt.secret=y8YYuiqQc/B1f+es4RxSNziSJcIPVjouX8aKY1JZPlE=

# --- メール送信設定（Mailpit） ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@type-clash.local

# --- ファイルアップロード設定 ---
# ローカルではプロジェクト直下の uploads を使用し、本番では APP_UPLOAD_DIR で上書きする
app.upload-dir=${APP_UPLOAD_DIR:uploads}
