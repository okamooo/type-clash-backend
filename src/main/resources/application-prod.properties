# PostgreSQL（EC2 上の DB。ホストは同一インスタンス内なので localhost）
spring.datasource.url=jdbc:postgresql://localhost:5432/type_clash_db
spring.datasource.username=typeclash
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/data.sql
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

server.port=8080

# 本番用 JWT 秘密鍵（開発環境とは別の値を使用すること）
jwt.secret=Kp9mN2xR7vQ4wL8hT5jF3sY6bC1dG0eA9uI4oP7nM2k=

# メール（EC2 に Mailpit がなければ OTP・パスワード再設定は動かない）
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@type-clash.local
