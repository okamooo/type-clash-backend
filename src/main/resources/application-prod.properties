# --- Amazon SES SMTP settings ---
# Set the following environment variables in the production runtime:
# SES_SMTP_USERNAME, SES_SMTP_PASSWORD, APP_MAIL_FROM
spring.mail.host=${SES_SMTP_HOST:email-smtp.ap-northeast-1.amazonaws.com}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME}
spring.mail.password=${SES_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${APP_MAIL_FROM}
